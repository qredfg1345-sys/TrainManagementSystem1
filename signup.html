<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Create account | Train Management</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><link rel="stylesheet" href="style.css"></head><body>
<main class="card"><h2>Create an account</h2><form id="signup"><div class="form-group"><label for="email">Email</label><input required id="email" type="email" autocomplete="email"></div><div class="form-group"><label for="password">Password (at least 8 characters)</label><input required id="password" type="password" minlength="8" autocomplete="new-password"></div><button class="btn-accent">Sign Up</button></form><p id="notice" role="status"></p><p style="text-align:center"><a href="index.html">Already have an account? Log in</a></p></main>
<script>
const client=window.supabase.createClient(window.TRAIN_CONFIG.url,window.TRAIN_CONFIG.publishableKey);
document.getElementById('signup').addEventListener('submit', async (event)=>{event.preventDefault();const notice=document.getElementById('notice');notice.textContent='Creating your account...';const email=document.getElementById('email').value.trim();const password=document.getElementById('password').value;const {data,error}=await client.auth.signUp({email,password,emailRedirectTo:new URL('index.html',location.href).href});if(error){notice.textContent=error.message;return;}if(data.session){location.href='dashboard.html';return;}notice.textContent='Account created. Check your email for a confirmation link, then log in.';});
</script></body></html>
